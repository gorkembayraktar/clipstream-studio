<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="cs-title cs-desc">
  <title id="cs-title">ClipStream Studio</title>
  <desc id="cs-desc">Yerel video ve canlı yayın klipleyici</desc>

  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151d"/>
      <stop offset="1" stop-color="#211b2b"/>
    </linearGradient>
    <linearGradient id="cs-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cs-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <filter id="cs-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="cs-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="260" rx="28" fill="url(#cs-bg)"/>
  <rect x="1" y="1" width="798" height="258" rx="27" fill="none" stroke="#3a3348" stroke-opacity=".8"/>

  <circle cx="124" cy="132" r="104" fill="#7c3aed" opacity=".18" filter="url(#cs-glow)"/>

  <rect x="48" y="58" width="148" height="148" rx="40" fill="url(#cs-tile)" filter="url(#cs-shadow)"/>
  <rect x="48" y="58" width="148" height="148" rx="40" fill="none" stroke="#e9d5ff" stroke-opacity=".22"/>
  <path d="M109 98 L168 132 L109 166 Z" fill="#ffffff"/>

  <text x="228" y="143" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.4" fill="#faf9fc">ClipStream</text>
  <text x="576" y="143" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="62" font-weight="400" letter-spacing="-1.4" fill="#c4b5fd">Studio</text>

  <rect x="230" y="196" width="58" height="4" rx="2" fill="url(#cs-accent)"/>
  <text x="230" y="224" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="18" font-weight="400" letter-spacing=".2" fill="#aaa4b5">Yerel video ve canlı yayın klipleyici</text>
</svg>
